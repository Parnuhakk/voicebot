name: Voice release checks

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: voice-release-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-checks.txt
      - name: Install pinned core and check dependencies
        run: python -m pip install -r requirements.txt -r requirements-checks.txt
      - name: Verify Linux host reconciliation and real Compose configuration
        run: >-
          python -m pytest -q
          tests/test_voice_release_sync.py
          tests/test_release_manifests.py
          tests/test_release_status.py
          tests/test_deployment_reuse.py
          tests/test_restaurant_deployment.py
          tests/test_telephony_deployment.py
          tests/test_twilio_deployment.py
      - name: Core regression suite (synthetic providers)
        run: python -m pytest tests -q

  shared-images:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build both production images from the same checkout
        run: |
          docker build --tag voicebot-web:ci .
          docker build --file deploy/telephony/Dockerfile --tag voicebot-telephone:ci .
      - name: Compare actual web and telephone source and behavior fingerprints
        shell: bash
        run: |
          voicebot_web_identity="$(docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint python voicebot-web:ci -m app.release_status identity)"
          voicebot_native_identity="$(docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint python voicebot-telephone:ci -m app.release_status identity)"
          test "$voicebot_web_identity" = "$voicebot_native_identity"
          test "${#voicebot_web_identity}" -eq 64
      - name: Import native worker and bridge without network or live credentials
        run: >-
          docker run --rm --network none --read-only --cap-drop ALL
          --security-opt no-new-privileges --entrypoint python
          voicebot-telephone:ci -c 'import app.worker; import app.twilio_bridge'
